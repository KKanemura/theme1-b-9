<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アキアキ</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <main>

        <h1>アキアキ</h1>

        <!-- メニュー画面 -->
        <section id="menu-page">

            <h2>メニュー</h2>

            <button id="check-button" type="button">
                空き状況の確認
            </button>

            <br><br>

            <button id="register-button" type="button">
                空き状況の登録
            </button>

        </section>

        <!-- 確認画面 -->
        <section id="check-page" style="display:none;">

            <h2>空き状況の確認</h2>

            <button id="back-from-check" type="button">
                戻る
            </button>

            <br><br>

            <div id="availability-list"></div>

        </section>

        <!-- 登録画面 -->
        <section id="register-page" style="display:none;">

            <h2>空き状況の登録</h2>

            <button id="back-from-register" type="button">
                戻る
            </button>

            <br><br>

            <form id="availability-form">

                <label>
                    対応場所
                    <select id="place-input">
                        <option value="ラーニングコモンズ">
                            ラーニングコモンズ
                        </option>
                        <option value="図書館">
                            図書館
                        </option>
                    </select>
                </label>

                <br><br>

                <label>
                    混雑率（目安）
                </label>

                <br>

                <input
                    id="available-input"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <p>
                    現在の混雑率：
                    <span id="usage-value">0%</span>
                </p>

                <p>
                    空き状況：
                    <span id="status-value">空き</span>
                </p>

                <!-- 追加したリアルタイムゲージ -->
                <div class="live-gauge">
                    <div
                        id="live-gauge-fill"
                        class="live-gauge-fill gauge-empty">
                    </div>
                </div>

                <p>
                    判定基準<br>
                    0〜69％：空き<br>
                    70〜99％：残りわずか<br>
                    100％：満席
                </p>

                <button type="submit">
                    空き状況を保存
                </button>

            </form>

        </section>

    </main>

</body>
</html>
